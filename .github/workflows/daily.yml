name: Daily Intelligence Agent

on:
  schedule:
    - cron: '0 2 * * *'   # 7:30 AM IST = 2:00 AM UTC, every day
  workflow_dispatch:
    inputs:
      mode:
        description: 'Agent mode'
        required: true
        default: 'both'
        type: choice
        options: [both, market, tech]

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run agent
        # For scheduled runs, github.event.inputs.mode is empty → defaults to "both"
        run: node agent.js ${{ github.event.inputs.mode || 'both' }}
        env:
          GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY }}
          SERPER_API_KEY:     ${{ secrets.SERPER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-${{ github.run_id }}
          path: reports/*.txt
          retention-days: 30
